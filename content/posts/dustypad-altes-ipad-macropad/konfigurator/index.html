<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<title>iPad Air 1 – Rahmen-Konfigurator</title>
<link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
<style>
:root{--bg:#0f1217;--card:#171b22;--card2:#1e232c;--line:#283040;--txt:#e8ecf2;--mut:#8b95a5;--acc:#4f8cff;--acc2:#7c5cff;--ok:#3ddc97;--warn:#ffb454;--r:14px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#171b22,#12161c);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;flex:none}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand small{color:var(--mut);font-size:12px}
#status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--card2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
#status.ok i{color:var(--ok)} #status.err{color:var(--warn)}
main{flex:1;min-height:0;display:flex;flex-direction:row}
#panel{order:1;width:400px;min-width:400px;overflow-y:auto;padding:12px 12px 16px;border-right:1px solid var(--line);background:var(--bg);-webkit-overflow-scrolling:touch}
#view{order:2;flex:1;position:relative;min-width:0;background:radial-gradient(circle at 50% 30%,#1b2230,#0f1217 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.tools>*{pointer-events:auto}
.seg{display:flex;background:#0d1015cc;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:9px;padding:9px 10px;font:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:38px}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#0d1015cc;backdrop-filter:blur(8px);color:var(--txt);font-size:20px;display:grid;place-items:center;cursor:pointer;padding:0}
.tools .right{display:flex;gap:8px}
#expand{display:none}
#info{position:absolute;left:10px;right:10px;bottom:10px;max-width:460px;background:#0d1015e6;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#info .ih{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.sp{flex:1}
#info .badge{background:var(--warn);color:#201400;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
#info .ib{display:none;padding:0 12px 10px;font-size:12.5px;max-height:34dvh;overflow-y:auto}
#info.open .ib{display:block}
#info.open .chev{transform:rotate(180deg)}
.chev{transition:transform .2s}
#info ul{margin:0;padding:0}
#info li{list-style:none;display:flex;gap:8px;margin:6px 0;color:#c9d1dd}
#info li i{font-size:16px;margin-top:1px;flex:none;color:var(--acc)}
#info li.w{color:var(--warn)} #info li.w i{color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:9px 14px;font:inherit;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chip:active{background:var(--card2)}
.chip i{color:var(--acc);font-size:16px}
details.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
details.card>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600;min-height:52px}
details.card>summary::-webkit-details-marker{display:none}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:#4f8cff22;color:var(--acc);flex:none}
.cnt{background:var(--acc);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;font-weight:700}
.cnt:empty{display:none}
details.card[open]>summary .chev{transform:rotate(180deg)}
.sec{padding:2px 14px 14px;border-top:1px solid var(--line)}
.row{margin:14px 0 0}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;min-height:28px}
.row.changed .lbl{color:#ffd37a}
.lbl{font-size:13px;color:#cdd5e0}
.val{display:flex;align-items:center;gap:6px}
output{color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.rs{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);display:grid;place-items:center;cursor:pointer;font-size:16px;padding:0}
.row:not(.changed) .rs{opacity:.3}
.rc{display:flex;align-items:center;gap:8px}
.st{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);display:grid;place-items:center;font-size:18px;cursor:pointer;padding:0}
.st:active{background:var(--acc)}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#4f8cff88,#7c5cff88)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#4f8cff88,#7c5cff88)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--acc);margin-top:-9px;box-shadow:0 2px 6px #0008}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.sw{position:relative;width:48px;height:28px;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#2a3140;border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sw input:checked+span:before{transform:translateX(20px)}
.row>.seg{background:#10141a}
.secbtn{margin-top:16px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--mut);border-radius:10px;padding:10px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.panel-hint{color:var(--mut);font-size:12.5px;margin:2px 4px 10px}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe));background:#12161c;border-top:1px solid var(--line)}
#bar button{flex:none;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 16px}
#bar button.primary{flex:1;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
#bar button i{font-size:20px}
.cli{font:12px ui-monospace,Menlo,monospace;background:#0b0e12;border:1px solid var(--line);border-radius:10px;padding:10px;color:#9fd0ff;overflow-x:auto;white-space:pre;margin-top:12px}
@media (max-width:820px){
  main{flex-direction:column}
  #view{order:1;flex:none;height:44dvh;transition:height .25s}
  #view.big{height:74dvh}
  #panel{order:2;width:auto;min-width:0;flex:1;border-right:0;border-top:1px solid var(--line)}
  #expand{display:grid}
  #info{max-width:none}
  .brand small{display:none}
}
</style>
<script type="importmap">
{"imports":{
"three":"https://esm.sh/three@0.160.0",
"three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/",
"three-mesh-bvh":"https://esm.sh/three-mesh-bvh@0.7.6?external=three",
"three-bvh-csg":"https://esm.sh/three-bvh-csg@0.0.16?external=three,three-mesh-bvh"
}}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div class="logo"><i class="bx bx-tablet"></i></div><div><b>iPad Air 1 Rahmen</b><small>Konfigurator · Export: OpenSCAD</small></div></div>
    <div id="status"><i class="bx bx-loader-alt bx-spin"></i><span>Lade …</span></div>
  </header>
  <main>
    <section id="panel">
      <div class="panel-hint"><i class="bx bx-info-circle"></i> Gelb = vom Standard abweichend, <i class="bx bx-reset"></i> setzt zurück. Die Vorschau dient nur zur Kontrolle.</div>
      <div id="controls"></div>
      <details class="card"><summary><span class="ico"><i class="bx bx-terminal"></i></span><span>STL aus OpenSCAD erzeugen</span><span class="sp"></span><i class="bx bx-chevron-down chev"></i></summary>
        <div class="sec"><div class="cli">openscad -o rahmen.stl \
  -D 'part="frame"' datei.scad</div>
        <div class="panel-hint" style="margin-top:10px">Teile: <b>frame</b>, <b>plate</b> (bei geschlossenem Rücken), <b>feet</b>.</div></div></details>
      <input type="file" id="fileIn" accept=".json" hidden>
    </section>
    <section id="view">
      <div class="tools">
        <div class="seg" id="viewSeg">
          <button data-v="assembly"><i class="bx bx-cube"></i><span>Aufgebaut</span></button>
          <button data-v="print"><i class="bx bx-printer"></i><span>Druck</span></button>
        </div>
        <div class="right">
          <button class="ibtn" id="fit" title="Ansicht zentrieren"><i class="bx bx-target-lock"></i></button>
          <button class="ibtn" id="expand" title="Vorschau vergrößern"><i class="bx bx-expand-vertical"></i></button>
        </div>
      </div>
      <div id="info"></div>
    </section>
  </main>
  <footer id="bar">
    <button id="bJson" title="Config speichern"><i class="bx bx-save"></i></button>
    <button id="bLoad" title="Config laden"><i class="bx bx-upload"></i></button>
    <button id="bScad" class="primary"><i class="bx bx-download"></i><span>OpenSCAD speichern</span></button>
  </footer>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

const statusEl = document.getElementById('status');
function setStatus(text, kind){
  const icon = kind==='busy' ? 'bx-loader-alt bx-spin' : kind==='err' ? 'bx-error' : 'bx-check-circle';
  statusEl.className = kind==='ok' ? 'ok' : kind==='err' ? 'err' : '';
  statusEl.innerHTML = `<i class="bx ${icon}"></i><span></span>`; statusEl.querySelector('span').textContent = text;
}
let Brush, Evaluator, SUBTRACTION, ADDITION;
try {
  ({Brush, Evaluator, SUBTRACTION, ADDITION} = await import('three-bvh-csg'));
} catch (err) {
  setStatus('CSG-Bibliothek nicht ladbar (Internet/CDN?)','err'); throw err;
}
const isMobile = () => matchMedia('(max-width:820px)').matches;

const DEF = {
  orient:'landscape',
  mount:false, mountY:0, shankD:4.5, headD:9, headH:3.5, slotL:12, roofT:2.5,
  fit:0.5, wall:6, front:3, outerR:12, pocketR:9.5, overlap:0.6, screenDx:0, screenDy:0,
  cableSide:1, cableMode:'open', cableWidth:22, cableOffset:0, cablePocket:32, holeD:9, holeInset:6,
  backMode:'open', lipW:3.5, lipT:3, capW:2.5, capT:2.4, groove:2,
  plateT:3, plateTop:4, plateClr:0.3, ventCount:7,
  powerCut:false, powerPos:22, powerSize:22, phoneCut:false, phonePos:22, phoneD:11,
  volCut:false, volPos:50, volSize:70, speakers:0,
  angle:10, footMode:'two', footW:24, footDepth:60, footFront:10, footH:30, footX:70,
  bedX:256, bedY:256, view:'assembly', opacity:1, showIpad:true
};
const PRESETS = [
  ['bx-landscape','Querformat (bewährt)',{}],
  ['bx-mobile-alt','Hochformat',{orient:'portrait', footX:55}],
  ['bx-pin','Wandmontage (hinten)',{mount:true}],
  ['bx-hide','Kabel versteckt',{cableMode:'hidden', backMode:'closed', angle:14, speakers:6}],
  ['bx-trending-down','Nach vorn geneigt',{angle:-15}],
  ['bx-leaf','Kompakt & leicht',{wall:4.5, front:2.4, footW:20, footH:26, footDepth:50}]
];
const open_ = p=>p.backMode==='open', closed_ = p=>p.backMode==='closed';
const land_ = p=>p.orient==='landscape', port_ = p=>p.orient==='portrait';
const SECTIONS = [
 {t:'Ausrichtung', icon:'bx-tablet', open:true, mob:true, c:[
  ['orient','Format (Einschub immer von oben)','select',[['landscape','Querformat'],['portrait','Hochformat']]]]},
 {t:'Wandaufhängung', icon:'bx-pin', open:true, mob:true, c:[
  ['mount','Unsichtbar hinten (Schlüssellöcher)','check'],
  ['mountY','Höhe der Schrauben (mm, 0 = Mitte)','range',-60,60,1,{showIf:p=>p.mount}],
  ['shankD','Schraubenschaft ⌀ (mm)','range',3,6,0.1,{showIf:p=>p.mount}],
  ['headD','Schraubenkopf ⌀ (mm)','range',7,12,0.5,{showIf:p=>p.mount}],
  ['headH','Kopfhöhe (mm)','range',2,6,0.5,{showIf:p=>p.mount}],
  ['slotL','Schlitzlänge (mm)','range',6,25,1,{showIf:p=>p.mount}],
  ['roofT','Haltesteg-Dicke (mm)','range',2,4,0.5,{showIf:p=>p.mount}]]},
 {t:'Kabel / Strom', icon:'bx-plug', open:true, mob:true, c:[
  ['cableSide','Home-Button / Ladeport-Seite','select',[[1,'Rechts'],[-1,'Links']],{showIf:land_}],
  ['cableMode','Kabel','select',[['open','Offen durch Wand'],['hidden','Versteckt']]],
  ['cableWidth','Breite Steckeröffnung (mm)','range',16,30,1,{showIf:p=>p.cableMode==='open'}],
  ['cableOffset','Port-Versatz (mm)','range',-10,10,0.5],
  ['cablePocket','Steckertasche Tiefe (mm)','range',24,45,1,{showIf:p=>p.cableMode==='hidden'}],
  ['holeD','Kabelloch ⌀ (mm)','range',7,14,0.5,{showIf:p=>p.cableMode==='hidden'}],
  ['holeInset','Loch-Abstand zur Außenwand (mm)','range',3,15,0.5,{showIf:p=>p.cableMode==='hidden'}]]},
 {t:'Rücken', icon:'bx-layer', open:true, c:[
  ['backMode','Rückseite','select',[['open','Offen'],['closed','Geschlossen']]],
  ['lipW','Halterand-Überstand (mm)','range',2.5,6,0.5,{showIf:open_}],
  ['lipT','Halterand-Dicke (mm)','range',2,5,0.2,{showIf:open_}],
  ['capW','Haltelippe Überstand (mm)','range',1.5,5,0.5,{showIf:closed_}],
  ['capT','Haltelippe Dicke (mm)','range',1.6,4,0.2,{showIf:closed_}],
  ['groove','Nuttiefe seitlich (mm)','range',1.5,4,0.5,{showIf:closed_}]]},
 {t:'Rückplatte', icon:'bx-rectangle', open:true, c:[
  ['plateT','Plattendicke (mm)','range',1.6,4,0.2,{showIf:closed_}],
  ['plateTop','Überstand oben über Rahmen (mm)','range',-3,10,0.5,{showIf:closed_}],
  ['plateClr','Spiel in der Nut (mm)','range',0.1,0.8,0.05,{showIf:closed_}],
  ['ventCount','Lüftungsschlitze','range',0,11,1,{showIf:closed_}]]},
 {t:'Ständer', icon:'bx-trending-up', open:true, c:[
  ['angle','Neigung (+ hinten, − vorn) (°)','range',-30,30,1,{showIf:p=>!p.mount}],
  ['footMode','Fußform','select',[['two','Zwei Füße'],['bar','Leiste']],{showIf:p=>!p.mount}],
  ['footW','Fußbreite (mm)','range',16,40,1,{showIf:p=>!p.mount&&p.footMode==='two'}],
  ['footX','Fußabstand von Mitte (mm)','range',40,100,1,{showIf:p=>!p.mount&&p.footMode==='two'}],
  ['footDepth','Standtiefe hinten (mm)','range',30,100,1,{showIf:p=>!p.mount}],
  ['footFront','Standtiefe vorn (mm)','range',10,100,1,{showIf:p=>!p.mount}],
  ['footH','Fußhöhe (mm)','range',20,45,1,{showIf:p=>!p.mount}]]},
 {t:'Tasten & Anschlüsse', icon:'bx-power-off', c:[
  ['powerCut','Ein/Aus-Taste freilegen','check',{showIf:land_}],
  ['powerPos','Taste: Abstand von oben (mm)','range',8,60,1,{showIf:p=>land_(p)&&p.powerCut}],
  ['powerSize','Fensterhöhe (mm)','range',14,35,1,{showIf:p=>land_(p)&&p.powerCut}],
  ['phoneCut','Kopfhörerbuchse freilegen','check',{showIf:land_}],
  ['phonePos','Buchse: Abstand von unten (mm)','range',10,60,1,{showIf:p=>land_(p)&&p.phoneCut}],
  ['phoneD','Loch ⌀ (mm)','range',9,16,0.5,{showIf:p=>land_(p)&&p.phoneCut}],
  ['volCut','Lautstärke-/Schalter-Fenster','check',{showIf:port_}],
  ['volPos','Fenstermitte von oben (mm)','range',20,100,1,{showIf:p=>port_(p)&&p.volCut}],
  ['volSize','Fensterhöhe (mm)','range',20,100,1,{showIf:p=>port_(p)&&p.volCut}],
  ['speakers','Lautsprecher-Schlitze (Anzahl)','range',0,12,2]]},
 {t:'Passform & Wände', icon:'bx-ruler', c:[
  ['fit','Spiel pro Seite (mm)','range',0.2,1,0.05],
  ['wall','Wandstärke (mm)','range',4,10,0.5],
  ['front','Frontblende (mm)','range',2,5,0.2],
  ['outerR','Außenradius Ecken (mm)','range',4,20,1],
  ['pocketR','Innenradius Tasche (mm)','range',5,14,0.5],
  ['overlap','Display-Überdeckung (mm)','range',0,2,0.1],
  ['screenDx','Display-Fenster X (mm)','range',-5,5,0.1],
  ['screenDy','Display-Fenster Y (mm)','range',-5,5,0.1]]},
 {t:'Vorschau & Druckbett', icon:'bx-slider-alt', c:[
  ['opacity','Rahmen-Transparenz','range',0.2,1,0.05],
  ['showIpad','iPad-Platzhalter anzeigen','check'],
  ['bedX','Bett X (mm)','range',180,400,1],
  ['bedY','Bett Y (mm)','range',180,400,1]]}
];

let P = {...DEF};
try { Object.assign(P, JSON.parse(localStorage.getItem('ipadAir1Cfg')||'{}')); } catch(e){}

const ctrlRoot = document.getElementById('controls');
const decimals = s => (String(s).split('.')[1]||'').length;

function buildUI(){
  const openState = {};
  ctrlRoot.querySelectorAll('details.card').forEach(d=>{ openState[d.dataset.t] = d.open; });
  ctrlRoot.innerHTML = '';
  const chips = document.createElement('div'); chips.className = 'chips';
  for (const [icon,name,over] of PRESETS) {
    const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = `<i class="bx ${icon}"></i><span>${name}</span>`;
    b.onclick = () => { P = {...DEF, ...over}; buildUI(); schedule(true); };
    chips.appendChild(b);
  }
  const ra = document.createElement('button'); ra.className = 'chip'; ra.innerHTML = '<i class="bx bx-reset"></i><span>Alles zurücksetzen</span>';
  ra.onclick = () => { P = {...DEF}; buildUI(); schedule(true); };
  chips.appendChild(ra);
  ctrlRoot.appendChild(chips);

  for (const sec of SECTIONS) {
    const d = document.createElement('details'); d.className = 'card'; d.dataset.t = sec.t;
    d.open = openState[sec.t] ?? (isMobile() ? !!sec.mob : !!sec.open);
    d.innerHTML = `<summary><span class="ico"><i class="bx ${sec.icon}"></i></span><span>${sec.t}</span><span class="cnt"></span><span class="sp"></span><i class="bx bx-chevron-down chev"></i></summary><div class="sec"></div>`;
    const box = d.querySelector('.sec');
    for (const [key,label,type,a,b,c,opt] of sec.c) {
      const row = document.createElement('div'); row.className = 'row'; row.dataset.key = key;
      const rs = '<button type="button" class="rs" title="Zurücksetzen"><i class="bx bx-reset"></i></button>';
      let showIf = null;
      if (type==='range') {
        const dec = decimals(c);
        row.innerHTML = `<div class="rh"><span class="lbl">${label}</span><span class="val"><output></output>${rs}</span></div>
          <div class="rc"><button type="button" class="st" data-d="-1"><i class="bx bx-minus"></i></button><input type="range" min="${a}" max="${b}" step="${c}"><button type="button" class="st" data-d="1"><i class="bx bx-plus"></i></button></div>`;
        const inp = row.querySelector('input'), out = row.querySelector('output');
        const setV = v => { v = Math.min(b, Math.max(a, Math.round(v/c)*c)); v = parseFloat(v.toFixed(dec)); P[key]=v; inp.value=v; out.textContent=v.toFixed(dec); markChanged(); schedule(false); };
        inp.value = P[key]; out.textContent = Number(P[key]).toFixed(dec);
        inp.oninput = () => setV(parseFloat(inp.value));

// ---------- Geometrie (nur Vorschau) ----------
const ev = new Evaluator(); ev.useGroups = false; ev.attributes = ['position'];
const E_ = 0.02;
function clean(g){
  g.deleteAttribute('uv'); g.deleteAttribute('normal'); g.clearGroups();
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++) p.setXYZ(i, Math.round(p.getX(i)*1e4)/1e4, Math.round(p.getY(i)*1e4)/1e4, Math.round(p.getZ(i)*1e4)/1e4);
  const m = mergeVertices(g, 1e-5); m.deleteAttribute('normal'); m.deleteAttribute('uv'); return m;
}
function finish(b){
  let g = b.geometry; g.deleteAttribute('uv'); g.deleteAttribute('normal'); g.clearGroups();
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++) p.setXYZ(i, Math.round(p.getX(i)*1e4)/1e4, Math.round(p.getY(i)*1e4)/1e4, Math.round(p.getZ(i)*1e4)/1e4);
  g = mergeVertices(g, 1e-5); g.computeVertexNormals(); return g;
}
function rrShape(w,h,r){
  r = Math.min(r,w/2-0.01,h/2-0.01); const x=-w/2,y=-h/2, s=new THREE.Shape();
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h); s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r); s.absarc(x+r,y+r,r,Math.PI,1.5*Math.PI,false); return s;
}
function ext(shape,z0,d,dx=0,dy=0){ const g=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:false,curveSegments:10}); g.translate(dx,dy,z0); return new Brush(clean(g)); }
function bx(x0,x1,y0,y1,z0,z1){ const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0); g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); return new Brush(clean(g)); }
function cylX(d,len,cx,cy,cz){ const g=new THREE.CylinderGeometry(d/2,d/2,len,32); g.rotateZ(Math.PI/2); g.translate(cx,cy,cz); return new Brush(clean(g)); }
function cylZ(d,len,cx,cy,z0){ const g=new THREE.CylinderGeometry(d/2,d/2,len,32); g.rotateX(Math.PI/2); g.translate(cx,cy,z0+len/2); return new Brush(clean(g)); }

function derive(P){
  const portrait = P.orient==='portrait';
  const ipadT=7.5, PW=portrait?169.5:240, PH=portrait?240:169.5;
  const W=PW+2*P.fit, H=PH+2*P.fit, OW=W+2*P.wall, OH=H+2*P.wall;
  const screenW=portrait?147.8:197.1, screenH=portrait?197.1:147.8;
  const s=P.cableSide, hidden=P.cableMode==='hidden', closed=P.backMode==='closed';
  const E=hidden?P.cablePocket:0, Z=P.front+ipadT+0.5;
  const sideE=!portrait&&E>0, botE=portrait&&E>0;
  const lipT=P.lipT, capT=P.capT, groove=P.groove, capW=P.capW, plateT=P.plateT, clr=P.plateClr, layerT=plateT+clr;
  const T=closed?Z+layerT+capT:Z+lipT;
  const eL=sideE&&s<0, eR=sideE&&s>0;
  const xLp=-W/2-(eL?E:0), xRp=W/2+(eR?E:0), yBp=-H/2-(botE?E:0);
  const ox0=-OW/2-(eL?E:0), ox1=OW/2+(eR?E:0), oy0=-OH/2-(botE?E:0), oy1=OH/2;
  // Wandaufhaengung: zwei Bloecke HINTEN auf den Seitenwaenden (von vorn unsichtbar)
  const rd=P.headD+0.6, gap=P.headH+1, bh=gap+P.roofT, bw=14, blocks=[];
  if (P.mount) for (const sg of [-1,1]) {
    const xe = sg>0?ox1:ox0;
    blocks.push({sg, xc:xe-sg*7, x0:sg>0?xe-bw:xe, x1:sg>0?xe:xe+bw, ky:P.mountY-P.slotL/2});
  }
  const angle = P.mount?0:P.angle;
  const footZ0 = P.mount ? 1 : 9;
  const M=new THREE.Matrix4().makeTranslation(0,0,footZ0)
    .multiply(new THREE.Matrix4().makeRotationX(THREE.MathUtils.degToRad(90-angle)))
    .multiply(new THREE.Matrix4().makeTranslation(0,-oy0,0));
  const footFront = Math.max(P.footFront, angle<0 ? 10+(P.footH-footZ0)*Math.tan(THREE.MathUtils.degToRad(-angle))+8 : 10);
  return {portrait,ipadT,PW,PH,W,H,OW,OH,screenW,screenH,s,hidden,closed,E,Z,sideE,botE,lipT,capT,groove,capW,plateT,clr,layerT,T,
    eL,eR,xLp,xRp,yBp,ox0,ox1,oy0,oy1,blocks,rd,gap,bh,angle,M,footFront,
    lipL:eL?0:P.lipW, lipR:eR?0:P.lipW, lipB:botE?0:P.lipW,
    grL:eL?0:groove, grR:eR?0:groove, grB:botE?0:groove};
}
function sub(a,list){ let r=a; for (const b of list) if (b) r = ev.evaluate(r,b,SUBTRACTION); return r; }

function buildBlock(P,D,b){
  const T=D.T, rd=D.rd, sd=P.shankD+0.4, ky=b.ky, gap=D.gap, bh=D.bh;
  const base = bx(b.x0,b.x1,ky-rd/2-2.2,ky+P.slotL+rd/2+2.2,T-E_,T+bh);
  const cuts = [
    bx(b.xc-rd/2,b.xc+rd/2,ky,ky+P.slotL,T-1,T+gap),
    cylZ(rd,gap+1,b.xc,ky,T-1), cylZ(rd,gap+1,b.xc,ky+P.slotL,T-1),
    bx(b.xc-sd/2,b.xc+sd/2,ky,ky+P.slotL,T+gap-0.1,T+bh+E_),
    cylZ(sd,P.roofT+0.3,b.xc,ky+P.slotL,T+gap-0.1),
    cylZ(rd,P.roofT+0.3,b.xc,ky,T+gap-0.1)

}
function buildFrame(P,D){
  const base = ext(rrShape(D.ox1-D.ox0,D.oy1-D.oy0,P.outerR),0,D.T,(D.ox0+D.ox1)/2,(D.oy0+D.oy1)/2);
  const cuts = [];
  cuts.push(ext(rrShape(D.W,D.H,P.pocketR),P.front,D.Z-P.front+E_));
  if (D.sideE) cuts.push(bx(D.s>0?D.W/2-1:-D.W/2-D.E, D.s>0?D.W/2+D.E:-D.W/2+1, -D.H/2,D.H/2, P.front, D.Z+E_));
  if (D.botE) cuts.push(bx(-D.W/2,D.W/2,-D.H/2-D.E,-D.H/2+1,P.front,D.Z+E_));
  cuts.push(bx(D.xLp,D.xRp,0,D.OH/2+1,P.front,D.Z+E_));
  if (D.closed) {
    cuts.push(bx(D.xLp-D.grL, D.xRp+D.grR, D.yBp-D.grB, D.OH/2+1, D.Z-E_, D.Z+D.layerT));
    cuts.push(bx(D.xLp+D.capW, D.xRp-D.capW, D.yBp+D.capW, D.OH/2+1, D.Z+D.layerT-E_, D.T+E_));
  } else {
    cuts.push(bx(D.xLp+D.lipL, D.xRp-D.lipR, D.yBp+D.lipB, D.OH/2+1, D.Z-E_, D.T+E_));
  }
  const sw=D.screenW-2*P.overlap, sh=D.screenH-2*P.overlap;
  cuts.push(bx(P.screenDx-sw/2,P.screenDx+sw/2,P.screenDy-sh/2,P.screenDy+sh/2,-E_,P.front+E_));
  const zc=P.front+D.ipadT/2, wt=(P.wall+4)/2;
  if (!D.hidden) {
    if (!D.portrait) { const cx=D.s*(D.W/2+P.wall/2);
      cuts.push(bx(cx-wt,cx+wt,P.cableOffset-P.cableWidth/2,P.cableOffset+P.cableWidth/2,zc-4.5,zc+4.5)); }
    else { const cy=-(D.H/2+P.wall/2);
      cuts.push(bx(P.cableOffset-P.cableWidth/2,P.cableOffset+P.cableWidth/2,cy-wt,cy+wt,zc-4.5,zc+4.5)); }
  }
  if (!D.portrait) {
    const ox=-D.s*(D.W/2+P.wall/2);
    if (P.powerCut) { const y=D.H/2-P.powerPos; cuts.push(bx(ox-wt,ox+wt,y-P.powerSize/2,y+P.powerSize/2,zc-4,zc+4)); }
    if (P.phoneCut) cuts.push(cylX(P.phoneD,P.wall+4,ox,-D.H/2+P.phonePos,zc));

}
function buildPlate(P,D){
  const x0=D.xLp-D.grL+D.clr, x1=D.xRp+D.grR-D.clr, y0=D.yBp-D.grB+D.clr, y1=D.OH/2+P.plateTop;

  const vy0=D.portrait?-65:-45, vy1=D.portrait?55:35;
  for (let i=0;i<P.ventCount;i++){ const x=(i-(P.ventCount-1)/2)*14;
    cuts.push(bx(x-2.5,x+2.5,vy0,vy1,D.Z-E_,D.Z+D.plateT+E_)); }
  if (D.hidden) {
    const hx = D.portrait ? P.cableOffset : D.s*(D.W/2+D.E-P.holeInset);
    const hy = D.portrait ? -(D.H/2+D.E-P.holeInset) : P.cableOffset;
    cuts.push(cylZ(P.holeD,D.plateT+2*E_,hx,hy,D.Z-E_));
    cuts.push(bx(hx-P.holeD/2,hx+P.holeD/2,hy,y1+1,D.Z-E_,D.Z+D.plateT+E_));

}
function buildFeet(P,D){
  if (P.mount) return [];

    : [[-P.footX-P.footW/2,-P.footX+P.footW/2],[P.footX-P.footW/2,P.footX+P.footW/2]];
  const slabW=D.ox1-D.ox0+4, slabX0=D.ox0-2;
  return blocks.map(([x0,x1])=>{
    const b=bx(x0,x1,-P.footDepth,D.footFront,0,P.footH);
    const g=new THREE.BoxGeometry(slabW,70,D.T+0.8);
    g.translate(slabX0+slabW/2,D.oy0-0.3+35,-0.4+(D.T+0.8)/2); g.applyMatrix4(D.M);
    return ev.evaluate(b,new Brush(clean(g)),SUBTRACTION);

}

let parts = null, firstFit = true, lastKey = '';
const matFrame = new THREE.MeshStandardMaterial({color:0x5b6475,roughness:.55,metalness:.1,transparent:true});
const matPlate = new THREE.MeshStandardMaterial({color:0x8a93a6,roughness:.55,metalness:.1});
const matFoot = new THREE.MeshStandardMaterial({color:0x6b768b,roughness:.55,metalness:.1});
const matIpad = new THREE.MeshStandardMaterial({color:0x9aa4b2,transparent:true,opacity:0.4,roughness:.3,metalness:.5});
function bbox(g){ g.computeBoundingBox(); return g.boundingBox.clone(); }

function rebuild(){
  const t0 = performance.now();
  try {
    const D = derive(P);
    const frame = finish(buildFrame(P,D));
    const plate = D.closed ? finish(buildPlate(P,D)) : null;
    const feet = buildFeet(P,D).map(finish);
    parts = {D,frame,plate,feet};
    render();
    setStatus(`Fertig · ${Math.round(performance.now()-t0)} ms`,'ok');
  } catch (err) { console.error(err); setStatus('Fehler: ' + err.message,'err'); }
}
function printMatrices(){
  const {frame,plate,feet} = parts, res = {frame:new THREE.Matrix4(), plate:new THREE.Matrix4(), feet:new THREE.Matrix4()};
  const fb = bbox(frame); let cursorY = fb.min.y - 12; const cx=(fb.min.x+fb.max.x)/2;
  if (plate) { const pb=bbox(plate); const v=new THREE.Vector3(cx-(pb.min.x+pb.max.x)/2, cursorY-pb.max.y, -pb.min.z);
    res.plate=new THREE.Matrix4().makeTranslation(v.x,v.y,v.z); cursorY = pb.min.y+v.y-12; }
  if (feet.length) { const fbx = new THREE.Box3(); feet.forEach(g=>fbx.union(bbox(g)));
    res.feet = new THREE.Matrix4().makeTranslation(cx-(fbx.min.x+fbx.max.x)/2, cursorY-fbx.max.y, -fbx.min.z); }
  return res;
}
function render(){
  content.clear(); if (!parts) return;
  const {D,frame,plate,feet} = parts, assembled = P.view==='assembly';
  const pm = printMatrices();
  const addMesh = (g,mat,m)=>{ const mesh=new THREE.Mesh(g,mat); mesh.matrixAutoUpdate=false; mesh.matrix.copy(m); content.add(mesh); return mesh; };
  matFrame.opacity = P.opacity;
  addMesh(frame,matFrame,assembled?D.M:pm.frame);
  if (plate) addMesh(plate,matPlate,assembled?D.M:pm.plate);
  feet.forEach(g=>addMesh(g,matFoot,assembled?new THREE.Matrix4():pm.feet));
  if (assembled && P.showIpad) {
    const g = new THREE.ExtrudeGeometry(rrShape(D.PW,D.PH,9),{depth:7.5,bevelEnabled:false,curveSegments:10}); g.translate(0,0,P.front);
    addMesh(g,matIpad,D.M);
  }
  updateInfo(D,pm);
  if (firstFit) fitCamera();
}
function fitCamera(){
  const box = new THREE.Box3().setFromObject(content); if (box.isEmpty()) return;
  const c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
  const r = Math.max(sz.x,sz.y,sz.z)*(isMobile()?1.5:1.3); controls.target.copy(c);
  camera.position.set(c.x+r*0.4,c.y-r*1.4,c.z+r*0.7); camera.far=r*10; camera.updateProjectionMatrix(); firstFit=false;
}
const infoEl = document.getElementById('info');
if (!isMobile()) infoEl.classList.add('open');
infoEl.addEventListener('click', e => { if (e.target.closest('.ih')) infoEl.classList.toggle('open'); });
function updateInfo(D,pm){
  const {frame,plate,feet} = parts, items=[], warns=[];
  const size = (g,m)=>{ const b=bbox(g); b.applyMatrix4(m); return b.getSize(new THREE.Vector3()); };
  const fs=size(frame,pm.frame);
  items.push(['bx-cube',`Rahmen: ${fs.x.toFixed(1)} × ${fs.y.toFixed(1)} × ${fs.z.toFixed(1)} mm`]);
  if (fs.x>P.bedX||fs.y>P.bedY) warns.push('Rahmen größer als das Druckbett.');
  if (plate) { const s=size(plate,pm.plate); items.push(['bx-rectangle',`Rückplatte: ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} mm`]);
    if (s.x>P.bedX||s.y>P.bedY) warns.push('Rückplatte größer als das Druckbett.'); }
  if (feet.length) { const fb=new THREE.Box3(); feet.forEach(g=>fb.union(bbox(g))); const ss=fb.getSize(new THREE.Vector3());
    items.push(['bx-trending-up',`Füße: ${ss.x.toFixed(1)} × ${ss.y.toFixed(1)} × ${ss.z.toFixed(1)} mm`]); }
  items.push(['bx-printer','Druck: Rahmen mit Front nach unten, Support aus, PETG, mind. 4 Wände.']);
  if (P.mount && D.blocks.length) {
    const dx = D.blocks[1].xc - D.blocks[0].xc;
    items.push(['bx-pin',`Wand: 2 Schrauben auf gleicher Höhe, Abstand ${dx.toFixed(1)} mm (Mitte–Mitte). Schaft-⌀ ${P.shankD} mm, Kopf-Oberkante ${(P.roofT+P.headH).toFixed(1)} mm über der Wand. Rahmen aufstecken, dann nach unten schieben. Keine Füße.`]);
    items.push(['bx-ruler',`Abstand Rahmenrückseite zur Wand: ${(D.T+D.bh-D.T).toFixed(1)} mm (Haltebloecke).`]);
  }
  if (P.angle<0 && !P.mount) items.push(['bx-trending-down',`Neigung nach vorn: Füße vorn automatisch auf ${D.footFront.toFixed(0)} mm verlängert.`]);
  if (D.hidden && !D.closed) items.push(['bx-hide','Kabel verlässt die Tasche an der offenen Rückseite.']);
  if (D.hidden && D.closed) items.push(['bx-hide','Kabelloch und Schlitz in der Rückplatte; Kabel beim Einschieben mitführen.']);
  if (P.powerCut||P.phoneCut||P.volCut||P.speakers>0) warns.push('Positionen von Tasten, Buchse und Lautsprecher sind Näherungswerte – am Gerät prüfen.');
  warns.push('Maßgeblich ist das Rendering in OpenSCAD, nicht diese Vorschau.');
  infoEl.innerHTML = `<div class="ih"><i class="bx bx-ruler"></i><span>${fs.x.toFixed(0)} × ${fs.y.toFixed(0)} × ${fs.z.toFixed(0)} mm</span><span class="sp"></span>${warns.length?`<span class="badge">${warns.length}</span>`:''}<i class="bx bx-chevron-down chev"></i></div>
   <div class="ib"><ul>${items.map(([i,t])=>`<li><i class="bx ${i}"></i><span>${t}</span></li>`).join('')}${warns.map(t=>`<li class="w"><i class="bx bx-error"></i><span>${t}</span></li>`).join('')}</ul></div>`;
}

let timer=null;
function geomKey(){ const {view,opacity,showIpad,bedX,bedY,...g}=P; return JSON.stringify(g); }
function schedule(refit){
  localStorage.setItem('ipadAir1Cfg',JSON.stringify(P));
  if (refit) firstFit = true;
  setStatus('Berechne …','busy');
  clearTimeout(timer);
  timer = setTimeout(()=>{
    if (parts && lastKey === geomKey()) { render(); setStatus('Fertig','ok'); }
    else { lastKey = geomKey(); rebuild(); }
  }, 220);
}

// ---------- Export ----------
function download(name, data, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
document.getElementById('bJson').onclick=()=>download('ipad_air1_config.json',JSON.stringify(P,null,2),'application/json');
document.getElementById('bLoad').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try { P={...DEF,...JSON.parse(await f.text())}; buildUI(); schedule(true); } catch(err){ alert('Ungültige Datei'); } };

function genScad(P){
  const b=v=>v?'true':'false';
  return `// iPad Air 1 Rahmen - generiert vom Konfigurator. Alle Masse in mm.
// part: "assembly", "frame", "plate", "feet"
// CLI:  openscad -o rahmen.stl -D 'part="frame"' datei.scad
part="assembly";
$fn=48;
portrait=${b(P.orient==='portrait')};   // Hochformat (Einschub immer von oben)
fit=${P.fit}; wall=${P.wall}; front=${P.front}; outer_r=${P.outerR}; pocket_r=${P.pocketR};
overlap=${P.overlap}; screen_dx=${P.screenDx}; screen_dy=${P.screenDy};
cable_side=${P.cableSide};          // nur Querformat: 1 = Home rechts, -1 = links
cable_hidden=${b(P.cableMode==='hidden')};
cable_width=${P.cableWidth}; cable_offset=${P.cableOffset};
cable_pocket=${P.cablePocket}; hole_d=${P.holeD}; hole_inset=${P.holeInset};
closed_back=${b(P.backMode==='closed')};
lip_w=${P.lipW}; lip_t=${P.lipT}; cap_w=${P.capW}; cap_t=${P.capT}; groove=${P.groove};
plate_t=${P.plateT}; plate_top=${P.plateTop}; plate_clr=${P.plateClr};
vent_count=${P.ventCount};
power_cut=${b(P.powerCut)}; power_pos=${P.powerPos}; power_size=${P.powerSize};
phone_cut=${b(P.phoneCut)}; phone_pos=${P.phonePos}; phone_d=${P.phoneD};
vol_cut=${b(P.volCut)}; vol_pos=${P.volPos}; vol_size=${P.volSize};
speaker_slots=${P.speakers};
// Wandaufhaengung: zwei Schluesselloch-Bloecke HINTEN auf den Seitenwaenden (von vorn unsichtbar)
mount=${b(P.mount)}; mount_y=${P.mountY};
shank_d=${P.shankD}; head_d=${P.headD}; head_h=${P.headH}; slot_l=${P.slotL}; roof_t=${P.roofT};
// Staender
angle_set=${P.angle};               // + nach hinten, - nach vorn
foot_bar=${b(P.footMode==='bar')};
foot_w=${P.footW}; foot_x=${P.footX}; foot_depth=${P.footDepth}; foot_front_min=${P.footFront}; foot_h=${P.footH};

pw=portrait?169.5:240; ph=portrait?240:169.5; ipad_t=7.5; e=0.02;
screen_w=portrait?147.8:197.1; screen_h=portrait?197.1:147.8;
W=pw+2*fit; H=ph+2*fit; OW=W+2*wall; OH=H+2*wall;
E=cable_hidden?cable_pocket:0;
side_e=(!portrait&&E>0); bot_e=(portrait&&E>0);
Z=front+ipad_t+0.5;
layer_t=plate_t+plate_clr;
T=closed_back?Z+layer_t+cap_t:Z+lip_t;
eL=(side_e&&cable_side<0); eR=(side_e&&cable_side>0);
xLp=-W/2-(eL?E:0);
xRp= W/2+(eR?E:0);
yBp=-H/2-(bot_e?E:0);
ox0=-OW/2-(eL?E:0); ox1=OW/2+(eR?E:0);
oy0=-OH/2-(bot_e?E:0); oy1=OH/2;
lipL=eL?0:lip_w; lipR=eR?0:lip_w; lipB=bot_e?0:lip_w;
grL=eL?0:groove; grR=eR?0:groove; grB=bot_e?0:groove;
zc=front+ipad_t/2;
angle=mount?0:angle_set;
foot_z0=mount?1:9;
foot_front=max(foot_front_min, angle<0 ? 10+(foot_h-foot_z0)*tan(-angle)+8 : 10);
rd=head_d+0.6; sd=shank_d+0.4;
gap=head_h+1; bh=gap+roof_t; bw=14;

module rr(w,h,r){offset(r=r) square([w-2*r,h-2*r],center=true);}
module obround(d,l){hull(){circle(d=d); translate([0,l]) circle(d=d);}}

// Schluesselloch-Block auf dem Rahmenruecken. Kopf laeuft in der Tasche (Hoehe gap),
// der Haltesteg (roof_t) liegt zur Wand hin. Einhaengen: Kopf in das Loch unten,
// dann Rahmen nach unten schieben, bis der Schaft oben im Schlitz anliegt.
module mblock(sgn){
 xe=sgn>0?ox1:ox0; xc=xe-sgn*7; ky=mount_y-slot_l/2;
 difference(){
  translate([sgn>0?xe-bw:xe, ky-rd/2-2.2, T-e]) cube([bw, slot_l+rd+4.4, bh+e]);
  translate([xc,ky,T-1]) linear_extrude(gap+1) obround(rd,slot_l);
  translate([xc,ky,T+gap-0.1]) linear_extrude(roof_t+0.3) obround(sd,slot_l);
  translate([xc,ky,T+gap-0.1]) cylinder(d=rd,h=roof_t+0.3);
 }
}

module frame(){
 union(){
 difference(){
   translate([(ox0+ox1)/2,(oy0+oy1)/2,0]) linear_extrude(T) rr(ox1-ox0,oy1-oy0,outer_r);
  translate([0,0,front]) linear_extrude(Z-front+e) rr(W,H,pocket_r);
  if(side_e) translate([cable_side>0?W/2-1:-W/2-E,-H/2,front]) cube([E+1,H,Z-front+e]);
  if(bot_e) translate([-W/2,-H/2-E,front]) cube([W,E+1,Z-front+e]);
  translate([xLp,0,front]) cube([xRp-xLp,OH/2+1,Z-front+e]);
  if(closed_back){
   translate([xLp-grL,yBp-grB,Z-e])
    cube([(xRp+grR)-(xLp-grL),OH/2+1-(yBp-grB),layer_t+e]);
   translate([xLp+cap_w,yBp+cap_w,Z+layer_t-e])
    cube([xRp-xLp-2*cap_w,OH/2+1-(yBp+cap_w),cap_t+2*e]);
  } else {
   translate([xLp+lipL,yBp+lipB,Z-e])
    cube([xRp-xLp-lipL-lipR,OH/2+1-(yBp+lipB),lip_t+2*e]);
  }
  translate([screen_dx,screen_dy,-e]) linear_extrude(front+2*e)
   square([screen_w-2*overlap,screen_h-2*overlap],center=true);
  if(!cable_hidden){
   if(!portrait) translate([cable_side*(W/2+wall/2),cable_offset,zc])
    cube([wall+4,cable_width,9],center=true);
   else translate([cable_offset,-(H/2+wall/2),zc])
    cube([cable_width,wall+4,9],center=true);
  }
  if(!portrait){
   if(power_cut) translate([-cable_side*(W/2+wall/2),H/2-power_pos,zc])
    cube([wall+4,power_size,8],center=true);
   if(phone_cut) translate([-cable_side*(W/2+wall/2),-H/2+phone_pos,zc])
    rotate([0,90,0]) cylinder(d=phone_d,h=wall+4,center=true);
  } else if(vol_cut) translate([W/2+wall/2,H/2-vol_pos,zc])
   cube([wall+4,vol_size,8],center=true);
  if(speaker_slots>0) for(i=[0:speaker_slots-1]){
   k=(i%2==0?1:-1)*(14+floor(i/2)*7);
   if(!portrait) translate([cable_side*(W/2+E+wall/2),k,zc]) cube([wall+4,3.5,6],center=true);
   else translate([k,-(H/2+E+wall/2),zc]) cube([3.5,wall+4,6],center=true);
  }
 }
 if(mount){ mblock(1); mblock(-1); }
 }
}

module plate(){
 hx=portrait?cable_offset:cable_side*(W/2+E-hole_inset);
 hy=portrait?-(H/2+E-hole_inset):cable_offset;
 py0=yBp-grB+plate_clr;
 y1=OH/2+plate_top;
 vy0=portrait?-65:-45; vy1=portrait?55:35;
 difference(){
  translate([xLp-grL+plate_clr,py0,Z])
   cube([(xRp+grR-plate_clr)-(xLp-grL+plate_clr),y1-py0,plate_t]);
  if(vent_count>0) for(i=[0:vent_count-1])
   translate([(i-(vent_count-1)/2)*14-2.5,vy0,Z-e]) cube([5,vy1-vy0,plate_t+2*e]);
  if(cable_hidden) translate([hx,hy,Z-e]){
   cylinder(d=hole_d,h=plate_t+2*e);
   translate([-hole_d/2,0,0]) cube([hole_d,y1-hy+1,plate_t+2*e]);
  }
 }
}

module mounted(){translate([0,0,foot_z0]) rotate([90-angle,0,0]) translate([0,-oy0,0]) children();}

module foot_block(x0,x1){
 difference(){
  translate([x0,-foot_depth,0]) cube([x1-x0,foot_depth+foot_front,foot_h]);
  mounted() translate([ox0-2,oy0-0.3,-0.4]) cube([ox1-ox0+4,70,T+0.8]);
 }
}
module feet(){
 if(!mount){
  if(foot_bar) foot_block(ox0,ox1);
  else { foot_block(-foot_x-foot_w/2,-foot_x+foot_w/2); foot_block(foot_x-foot_w/2,foot_x+foot_w/2); }
 }
}

if(part=="frame") frame();
if(part=="plate") translate([0,0,-Z]) plate();
if(part=="feet") feet();
if(part=="assembly"){
 mounted(){
  color("#333333") frame();
  if(closed_back) color("#777777") plate();
  %translate([0,0,front]) linear_extrude(ipad_t) rr(pw,ph,9);
 }
 color("#555555") feet();
}
`;
}
document.getElementById('bScad').onclick=()=>download('ipad_air_1_konfig.scad',genScad(P),'text/plain');

buildUI(); lastKey = geomKey(); rebuild();
</script>
</body>
</html>
